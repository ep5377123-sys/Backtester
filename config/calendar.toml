# Exchange calendars: scheduled early closes, Eastern wall-clock time (America/New_York).
# A contract uses the calendar named by `calendar` in config/contracts.toml.
#
# early_close: trading date -> the time the exchange halts that day. A session listed here closes at
# min(session template end, this time); every other session closes at its template end (config/sessions.toml).
# Days the exchange is closed all day (New Year's Day, Christmas, most Good Fridays) have no session: leave them out.
# These are published in advance, so a strategy may use them without looking ahead (Strategy.session_close).
#
# Update every year from CME's holiday calendar: https://www.cmegroup.com/tools-information/holiday-calendar.html
# 2023-2026 were checked against the NQ minute store (the last bar of each short session).

[cme_equity]
name = "CME equity index futures (NQ, MNQ, ES, MES) on Globex"

[cme_equity.early_close]
