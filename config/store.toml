# Shared market-data store (Phase 14): built by `guban store build`, read by Guban and the Research Pipeline.
# Layout and rules: D:\Market Data\README.md (written by the build) and PLAN.md "Phase 14–15 plan".

root = 'D:\Market Data'          # the store (write-once session files)
source = 'D:\Deepchart\Database' # DeepCharts folder, opened read-only

# Which source builds the 1-minute bars (user, 2026-10-07): "minute" = the DeepCharts minute records, ticks only for a
# session whose minute file holds no volume; ticks are stored either way, for strategies that need them.
# "tick" = the Phase 14 rule below. Changing it means rebuilding the stored sessions (--rebuild SYM:all).
bars = "minute"

# Tick check (quality.csv tick_ok; with bars = "tick" it also picks the bar source): a session's ticks pass when the
# tick file is whole, its summed size is within tolerance_pct of the minute volume, and at least min_minute_match of
# its minutes have exactly the minute record's volume (2025-11+ GC ticks miss ~2% of trades spread over most
# minutes; NQ/ES match 99.7-100%).
tolerance_pct = 2.0
min_minute_match = 0.99

# A file dated D holds the session from 18:00 ET on D; it is built once now >= D + 1 day at session_end (ET) plus
# settle_minutes, and the file has not been modified for settle_minutes. 18:00, not 17:00: BTC trades 24/7 since
# 2026-05-29 and its files carry bars up to 17:59.
session_end = "18:00"
settle_minutes = 10

# quality.csv flags a front-contract session as thin when its volume is below thin_ratio x the median of the
# previous 20 front sessions (e.g. ES 202609 files stop on 2026-08-16, leaving only the back month).
thin_ratio = 0.2

[symbols]   # store symbol = DeepCharts folder
NQ = "NQ-CME"
MNQ = "MNQ-CME"
ES = "ES-CME"
MES = "MES-CME"   # added 2026-10-07: appeared in the DeepCharts folder after the reinstall
# GC dropped 2026-10-07 (user: only NQ, ES, MNQ, MES, BTC from now on). Its files built in Phase 14 are still under
# D:\Market Data\GC (not listed here, so builds and verify skip them).
BTC = "BTC-CME"
