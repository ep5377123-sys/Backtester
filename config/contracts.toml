# CME contract specifications. point_value is USD per 1.0 price point per contract.
# tick_value = point_value * tick_size. calendar: scheduled early closes, from config/calendar.toml.
# commission, slippage: default costs, USD per contract per round trip, used by run/optimize/wfo when no
# --commission/--slippage is given (explicit flags, e.g. MC-parity runs, win). Slippage = 1 tick round trip (half a
# tick per side), charged half per market/stop fill, none on limit fills. Sources: PLAN.md "Phase 14–15 plan" costs
# table (NQ, MNQ: the user's pipeline values; ES: Topstep itemized all-in; BTC: $1.00 commission + 2 x $7.50 CME
# non-member exchange fee + 2 x $0.02 NFA) and "Phase 15 plan" (MES: Topstep $0.50 + $0.70 exchange + $0.02 NFA).

